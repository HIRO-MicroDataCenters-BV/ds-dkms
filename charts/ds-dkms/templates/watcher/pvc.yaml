{{- if and .Values.watcher.enabled .Values.watcher.persistence.enabled -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ds-dkms.fullname" . }}-watcher
  labels:
    {{- include "ds-dkms.watcher.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- range .Values.watcher.persistence.accessModes }}
    - {{ . | quote }}
    {{- end }}
  {{- if .Values.watcher.persistence.storageClass }}
  storageClassName: {{ .Values.watcher.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.watcher.persistence.size | quote }}
{{- end }}
