{{- if .Values.watcher.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ds-dkms.fullname" . }}-watcher
  labels:
    {{- include "ds-dkms.watcher.labels" . | nindent 4 }}
spec:
  type: {{ .Values.watcher.service.type }}
  selector:
    {{- include "ds-dkms.watcher.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.watcher.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
