{{- if .Values.mesagkesto.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ds-dkms.fullname" . }}-mesagkesto
  labels:
    {{- include "ds-dkms.mesagkesto.labels" . | nindent 4 }}
spec:
  type: {{ .Values.mesagkesto.service.type }}
  selector:
    {{- include "ds-dkms.mesagkesto.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.mesagkesto.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
