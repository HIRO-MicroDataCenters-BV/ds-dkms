# chart-testing values: full stack with watcher enabled, for post-M36 topology.
# Witness×3 + watcher + mesagkesto.

baseDomain: lab.nextgen.hiro-develop.nl

witness:
  enabled: true
  replicaCount: 3
  seedSecretName: dkms-witness-seeds
  ingress:
    enabled: true

watcher:
  enabled: true
  seedSecretName: dkms-watcher-seed
  initialOobis:
    - "https://dkms-witness-1.lab.nextgen.hiro-develop.nl/oobi/placeholder-aid-1"
    - "https://dkms-witness-2.lab.nextgen.hiro-develop.nl/oobi/placeholder-aid-2"
    - "https://dkms-witness-3.lab.nextgen.hiro-develop.nl/oobi/placeholder-aid-3"
  ingress:
    enabled: true
    tls:
      enabled: true
      secretName: dkms-watcher-tls

mesagkesto:
  enabled: true
  seedSecretName: dkms-mesagkesto-seed
  ingress:
    enabled: true
    tls:
      enabled: true
      secretName: dkms-mesagkesto-tls
